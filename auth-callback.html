<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completing GitHub sign-in — CodeDNA</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #FDFCF9;
      --card: #FFFFFF;
      --ink: #0F1A20;
      --muted: #6B7A89;
      --faint: #9AA8B6;
      --line: rgba(15, 26, 32, 0.08);
      --accent: #C2A47A;
      --accent-soft: #E8DCC8;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      display:grid;place-items:center;
      background: var(--paper);
      color:var(--ink);
      font-family:Inter,system-ui,sans-serif;
      padding:24px;
    }
    body::before{
      content:"";position:fixed;inset:0;pointer-events:none;opacity:0.035;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.9'/%3E%3C/svg%3E");
    }
    .card{position:relative;z-index:1;width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 1px 0 rgba(15,26,32,0.04), 0 20px 48px -20px rgba(15,26,32,0.12)}
    .card::before{content:"";position:absolute;top:0;left:20px;right:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(194,164,122,0.38),transparent)}
    .eyebrow{letter-spacing:.14em;text-transform:uppercase;font-size:10px;color:var(--muted);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
    .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(194,164,122,0.45)}
    h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:26px;line-height:1.2;color:var(--ink);letter-spacing:-0.02em}
    p{margin-top:10px;color:var(--muted);line-height:1.6;font-size:13.5px}
    .mono{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--faint);word-break:break-all;margin-top:10px}
    a{color:var(--accent);text-underline-offset:2px}
    a:hover{color:#8C704F}
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">GitHub sign-in</div>
    <h1 id="title">Finishing up…</h1>
    <p id="msg">Talking to the CodeDNA backend.</p>
    <p id="detail" class="mono"></p>
  </div>
<script>
const title = document.getElementById('title')
const msg = document.getElementById('msg')
const detail = document.getElementById('detail')
function fail(m, d){
  title.textContent = 'Something went wrong'
  msg.textContent = m
  if(d) detail.textContent = d
}
;(async function main(){
  const params = new URLSearchParams(location.search)
  const code = params.get('code')
  const err = params.get('error')
  const errDesc = params.get('error_description')
  var _origin = location.origin;
  if(err){
    if(err === 'access_denied'){
      fail('You cancelled the GitHub authorize screen.', 'Go back to ' + _origin + ' and click Connect with GitHub again.')
    } else {
      fail(errDesc || 'GitHub refused the request.', err)
    }
    return
  }
  if(!code){
    fail('No code in the redirect.','Start from ' + _origin + ' and click Connect with GitHub again.')
    return
  }

  const isProd = location.hostname.includes('pages.dev');
  const bases = isProd
    ? ['https://code-dna.vashishthapatel2005.workers.dev/api/v1']
    : ['/api/v1','http://localhost:8081/api/v1','http://localhost:8080/api/v1']
  let lastErr = null
  let lastBody = ''

  for(const base of bases){
    try{
      const r = await fetch(base + '/auth/github/callback', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({code})
      })
      const text = await r.text()
      lastBody = text
      let body = {}
      try{ body = text ? JSON.parse(text) : {} }catch{ body = {} }
      if(!r.ok){
        const raw = body.message || body.error || body.errorDescription || text || ('HTTP '+r.status)
        if(String(raw).toLowerCase().includes('bad_verification_code')){
          throw new Error('This login link has already been used. Please go to ' + _origin + ' and click Connect with GitHub again. Do not refresh this page.')
        }
        const shortRaw = String(raw).slice(0, 400)
        throw new Error(shortRaw)
      }
      const token = body.token
      const refresh = body.refreshToken
      const user = body.user
      if(!token || !user) throw new Error('Backend returned no token. Check: docker logs codedna-auth --tail 50')
      try{
        localStorage.setItem('token', token)
        if(refresh) localStorage.setItem('refreshToken', refresh)
        if(user.id) localStorage.setItem('userId', String(user.id))
        if(user.githubAccessToken) localStorage.setItem('gh_token', user.githubAccessToken)
        var login = user.githubUsername || user.handle || user.email || 'you'
        var name = user.name || login
        var avatarUrl = user.avatarUrl || ''
        try{
          var prev = JSON.parse(localStorage.getItem('gh_user')||'null')
          localStorage.setItem('gh_user', JSON.stringify({
            login: login, name: name, avatarUrl: avatarUrl,
            publicRepos: (prev && prev.publicRepos) || 0,
            privateRepos: 0,
            repoCount: (prev && prev.repoCount) || 0
          }))
        }catch(e2){
          localStorage.setItem('gh_user', JSON.stringify({login: login, name: name, avatarUrl: avatarUrl, publicRepos:0, privateRepos:0, repoCount:0}))
        }
        localStorage.setItem('gh_connected_at', new Date().toISOString())
      }catch(e){}
      title.textContent = 'Connected'
      msg.textContent = 'Signed in as ' + (user.githubUsername || user.handle || user.email) + '. Taking you to your dashboard...'
      detail.textContent = ''
      setTimeout(function(){ location.replace('/app.html#/') }, 900)
      return
    }catch(e){
      lastErr = e
      if(String(e.message).includes('already been used')) break
      if(bases.indexOf(base) === bases.length - 1) break
    }
  }
  var m = (lastErr instanceof Error ? lastErr.message : String(lastErr)) || 'Backend did not answer.'
  if(m.length > 500) m = m.slice(0, 500)
  var isNetwork = m.indexOf('Failed to fetch') !== -1 || m.indexOf('NetworkError') !== -1 || m.indexOf('Load failed') !== -1
  var isBurned = m.indexOf('already been used') !== -1
  var hint = isBurned ? '' :
    isNetwork ? 'Is the backend running? Run: cd backend && docker compose up -d postgres auth-service (wait 15 sec) then npm run dev. Then go to ' + _origin + ' and click Connect with GitHub again. Do NOT refresh this page.' :
    lastBody && lastBody.includes('<!doctype') ? 'Backend returned an error page. Check: docker logs codedna-auth --tail 80 and make sure backend/.env has the new GITHUB_CLIENT_SECRET, then docker compose up -d --build postgres auth-service' :
    'If you refreshed this page, the code is now burned. Go back to ' + _origin + ' and click Connect with GitHub again.'
  fail(m, hint)
})()
</script>
</body>
</html>
