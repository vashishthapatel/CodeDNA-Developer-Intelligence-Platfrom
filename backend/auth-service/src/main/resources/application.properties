spring.application.name=auth-service
server.port=8081

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codedna_auth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:codedna-super-secret-key-change-in-production-minimum-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- GitHub OAuth (set via env — never commit) ---
# Create at https://github.com/settings/developers → OAuth Apps
# Callback URL must be: http://localhost:8081/api/v1/auth/github/callback  (or frontend callback if you use SPA flow)
github.oauth.client-id=${GITHUB_CLIENT_ID:}
github.oauth.client-secret=${GITHUB_CLIENT_SECRET:}
# Where the frontend lives that receives ?code= and POSTs it here:
github.oauth.frontend-callback-url=${GITHUB_FRONTEND_CALLBACK_URL:http://localhost:5173/auth-callback.html}

# Logging
logging.level.com.codedna=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
