server.port=8086
spring.application.name=refactoriq-service

# Database Configuration (supports H2 by default or PostgreSQL if configured)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/codedna_refactoriq;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAPI Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Analysis Configuration
refactoriq.analysis.timeout-seconds=60
refactoriq.temp-dir=./temp-repos
