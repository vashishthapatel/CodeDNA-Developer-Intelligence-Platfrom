version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: codedna-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - codedna-network

  # Kafka & Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: codedna-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - codedna-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: codedna-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - codedna-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: codedna-redis
    ports:
      - "6379:6379"
    networks:
      - codedna-network

  # Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: codedna-auth
    depends_on:
      - postgres
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/codedna_auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-codedna-super-secret-key-change-in-production-minimum-256-bits}
      JWT_EXPIRATION: 86400000
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_FRONTEND_CALLBACK_URL: ${GITHUB_FRONTEND_CALLBACK_URL:-http://localhost:5173/auth-callback.html}
    networks:
      - codedna-network

  # Repository Service
  repository-service:
    build:
      context: ./repository-service
      dockerfile: Dockerfile
    container_name: codedna-repository
    depends_on:
      - postgres
      - kafka
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/codedna_repository
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - codedna-network

  # Analytics Service
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: codedna-analytics
    depends_on:
      - repository-service
    ports:
      - "8083:8083"
    environment:
      REPOSITORY_SERVICE_URL: http://repository-service:8082
    networks:
      - codedna-network

  # Scoring Engine
  scoring-engine:
    build:
      context: ./scoring-engine
      dockerfile: Dockerfile
    container_name: codedna-scoring
    depends_on:
      - postgres
      - kafka
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/codedna_scoring
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - codedna-network

  # Recommendation Engine
  recommendation-engine:
    build:
      context: ./recommendation-engine
      dockerfile: Dockerfile
    container_name: codedna-recommendation
    depends_on:
      - postgres
      - kafka
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/codedna_recommendations
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    networks:
      - codedna-network

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: codedna-gateway
    depends_on:
      - auth-service
      - repository-service
      - analytics-service
      - scoring-engine
      - recommendation-engine
      - redis
      - kafka
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      REPOSITORY_SERVICE_URL: http://repository-service:8082
      ANALYTICS_SERVICE_URL: http://analytics-service:8083
      SCORING_SERVICE_URL: http://scoring-engine:8084
      RECOMMENDATION_SERVICE_URL: http://recommendation-engine:8085
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: codedna-super-secret-key-change-in-production-minimum-256-bits
    networks:
      - codedna-network

networks:
  codedna-network:
    driver: bridge

volumes:
  postgres-data:
